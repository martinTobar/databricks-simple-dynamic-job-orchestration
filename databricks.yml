# This is a Declarative Automation Bundle definition for dynamic_orchestration_sample.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dynamic_orchestration_sample
  uuid: 1554e7c0-95f3-4137-9004-77fb817aa105

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-1112095f-49fd.cloud.databricks.com
    variables:
      catalog: workspace
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-1112095f-49fd.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/urkulabs@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/urkulabs@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: urkulabs@gmail.com
        level: CAN_MANAGE
