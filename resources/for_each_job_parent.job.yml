resources:
  jobs:
    for_each_job_parent:
      name: For each job (parent)
      tasks:
        - task_key: get_data
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/create_mock_states_data.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: print_states_data
          depends_on:
            - task_key: get_data
          disabled: false
          email_notifications: {}
          for_each_task:
            inputs: '{{tasks.get_data.values.states}}'
            task:
              disabled: false
              email_notifications: {}
              run_if: ALL_SUCCESS
              run_job_task:
                job_id: ${resources.jobs.if_else_job.id}
                job_parameters:
                  code: '{{input.code}}'
                  state: '{{input}}'
              task_key: print_states_data_iteration
              timeout_seconds: 0
              webhook_notifications: {}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
      email_notifications:
        no_alert_for_skipped_runs: false
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
